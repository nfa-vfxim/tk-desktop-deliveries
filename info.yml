configuration:
  delivery_sequence:
    type: template
    fields: context, version, SEQ, *
    description: "Template to deliver the sequences to."

  delivery_folder:
    type: template
    description: "Folder to deliver to."

  default_root:
    type: str
    default_value: "primary"
    description: "Default roots to get to get project location on disk."

  preselect_status:
    type: str
    default_value: "rfd"
    description: >
      Shots with this status code are ticked by default when the app opens.
      Shots whose status is named "Ready for Delivery" are always ticked too.
      All shots are always listed and can be (de)selected regardless of status.
      Set to an empty string to start with nothing selected.

  hidden_statuses:
    type: list
    values:
      type: str
    default_value: ["omt"]
    description: >
      Shots with one of these status codes are not listed at all.
      Shots whose status is named "Omit" are always hidden too.

  set_delivered_status:
    type: bool
    default_value: false
    description: >
      If true, the shot status is set to delivered_status after a successful
      delivery. Off by default so delivering never changes shot statuses.

  delivered_status:
    type: str
    default_value: "fin"
    description: Status to set the shot to after delivery (only if set_delivered_status is true).


# this app works in all engines - it does not contain
# any host application specific commands
supported_engines:

# the Shotgun fields that this engine needs in order to operate correctly
requires_shotgun_fields:

# More verbose description of this item
display_name: "ShotGrid Deliveries App"
description: "App to deliver shots with the correct naming convention."

# Required minimum versions for this item to run
requires_shotgun_version:
requires_core_version: "v0.14.28"
requires_engine_version:

# the frameworks required to run this app
frameworks:
